# Local gate mirroring CI exactly — a green pre-commit means a green CI lint job.
# Install once with:  uv run pre-commit install
default_install_hook_types: [pre-commit]
default_language_version:
  python: python3.12

repos:
  # --- Hygiene ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Vendored assets are excluded from both fixers: their bytes must stay identical to
      # what upstream published, because `VENDOR.md` records a SHA-256 of each one and
      # the digest test is what turns a silent substitution into a red build. A stripped
      # trailing newline is indistinguishable from a tampered file to a hash, and "the
      # formatter did it" is not a distinction a supply-chain check can afford to make.
      - id: trailing-whitespace
        exclude: ^muster-engine/src/muster/api/static/vendor/
      - id: end-of-file-fixer
        exclude: ^muster-engine/src/muster/api/static/vendor/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # Nothing large belongs in this repo: no weights, no clips, no frames.
        args: [--maxkb=512]
      - id: detect-private-key
      - id: debug-statements

  # --- Secrets ---------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # --- Shell ----------------------------------------------------------------
  # CI scripts run with the repository's permissions. An unquoted expansion here is a
  # different class of bug than one in application code.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # --- Lint + format (one tool) ---------------------------------------------
  # KEEP THIS REV EQUAL TO THE `ruff` VERSION IN `uv.lock`. CI runs `uv run ruff` off the
  # lock and this hook runs its own pinned build; when the two drift they are two
  # different formatters over one file, and the hook re-writes what CI just accepted.
  # Dependabot's uv ecosystem cannot see this file, so the pairing is manual.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # --- Lockfile stays in sync with pyprojects -------------------------------
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.15
    hooks:
      - id: uv-lock

  # --- Types + architecture -------------------------------------------------
  # Run through the project venv so both packages and their stubs resolve.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [muster-engine/src, muster-engine/tests]

      - id: import-linter
        name: import-linter (module boundaries)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: \.(py|toml)$
