name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published query finds old code without waiting for a commit.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    # Uploading results needs code scanning enabled, which on a private repository means
    # GitHub Advanced Security. Without it the queries run for several minutes and then
    # fail at the upload step, so gating here saves the run rather than just the error.
    #
    # Gated on visibility rather than deleted: the repo goes public at launch, and this
    # is a security gate that should be live on the first public pull request without
    # depending on anyone remembering to restore it.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          # security-extended over the default set: this is a repo whose entry points are
          # a video stream, a YAML file, and an untrusted HTTP body.
          queries: security-extended

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:python
