# The merge gate (implements P0.5). A PR that is red here cannot merge.
#
# Every action is pinned to a full commit SHA, never a tag: tags are mutable, and a
# compromised action is a compromised release. The comment after each SHA records which
# version it was, so Dependabot's bumps stay readable in review.
#
# NOTE: this workflow uses `pull_request`, never `pull_request_target`. Forked PRs run
# without secrets, by design — `pull_request_target` with a checkout of the PR head is
# the classic fork-to-repo-secret escalation, and it is banned in this repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. A job that needs more asks for it, in the job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.15"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy mesopic-engine/src mesopic-engine/tests tools/docs

  architecture:
    name: import-linter (module boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Analytics must not persist, ingest must not detect, and the sync client must
      # have no path to a frame. These are architecture, not style.
      - run: uv run lint-imports --verbose

  test:
    name: pytest (CPU-only — the baseline that matters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Golden-clip accuracy tests and the N100 perf harness are deliberately excluded:
      # CI cannot assert the M0 gate, only guard regressions in logic.
      - run: uv run pytest -m "not slow" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  soak:
    name: reliability soaks (flapping camera, full disk, dead broker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # These are `slow`, so the job above deselects them — and a soak nothing runs is a
      # soak that rots. Scoped to the one file rather than `-m slow`, which would also
      # pull in the model-download and golden-clip tests: those need the network and an
      # accelerator, and a merge gate that depends on either is a gate that goes red for
      # reasons unrelated to the change. This file spawns local processes and nothing else.
      - run: uv run pytest mesopic-engine/tests/test_reliability_soak.py -m slow
        timeout-minutes: 10

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    # `contents: read` only, inherited from the workflow default. The licensed action
    # needed `pull-requests: read` to ask the API which commits to scan; the binary reads
    # the checkout, so the grant goes with it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan history, not just the diff
      # The scanner is MIT. The action that wraps it is not: it requires a paid licence
      # for organisation-owned repositories and fails closed without one, which is what
      # happened the moment this repository moved into the organisation. Running the
      # binary keeps the gate free, drops a third-party JavaScript action from the supply
      # chain, and pins the version the pre-commit hook already uses, so the local hook
      # and the merge gate cannot disagree about what counts as a secret.
      #
      # Pinned by checksum for the reason actions are pinned by SHA: a release asset is
      # mutable, and a scanner that has been swapped is a gate that passes everything.
      - name: install gitleaks
        env:
          VERSION: "8.28.0"
          SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks

      # `git`, not `detect` — the latter was removed in v8. The command exits non-zero on
      # a finding, and prints the commit count it scanned, so a gate that silently looked
      # at nothing is visible in the log rather than indistinguishable from a pass.
      # --redact keeps the secret itself out of a log that is public the day this
      # repository is.
      - run: gitleaks git --config .gitleaks.toml --redact --no-banner .

  dependencies:
    name: dependency review
    runs-on: ubuntu-latest
    # Dependency review needs the dependency graph *plus* GitHub Advanced Security, which
    # a private repository does not have. Gated on visibility rather than deleted, so it
    # starts running by itself the day the repo goes public — the licence gate below is
    # the mechanism that keeps AGPL out of the default graph (ADR-0013), and it should be
    # live from the first public PR without anyone having to remember to re-add it.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The default install must carry no AGPL anywhere (ADR-0013).
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, SSPL-1.0
          fail-on-severity: moderate
          # Two packages are allowed past that line, and the reason is that this action
          # reads `uv.lock`. One lockfile describes *every* extra, so the opt-in
          # `mesopic[ultralytics]` extra puts ultralytics in it by construction — the
          # comment that used to sit here claimed the opposite, and was wrong. Bumping an
          # AGPL package this repository knowingly locks would otherwise fail a legitimate
          # dependabot PR for ever, which is how a licence gate stops being read.
          #
          # An allow-list alone would also let ultralytics migrate into the *default*
          # dependencies unnoticed, which is the one thing the deny-list was protecting.
          # `test_licence_boundary.py` is what replaces that: it walks the lockfile from
          # the root package's own dependencies and fails if an AGPL package is reachable
          # without the extra — and it asserts this list and its list are the same list,
          # so a third AGPL package cannot be waved through here alone.
          allow-dependencies-licenses: pkg:pypi/ultralytics, pkg:pypi/ultralytics-platform

  image:
    name: engine image builds, and carries no weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/engine.Dockerfile
          push: false
          load: true
          tags: mesopic-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # ADR-0008: the model is a separately-licensed runtime artefact, never baked in.
      # If this ever fails, someone has welded a licence into the image.
      - name: assert no model weights in the image
        run: scripts/assert-no-model-weights.sh mesopic-engine:ci

      # The entrypoint has to actually resolve. A venv copied across stages carries
      # absolute shebangs, and a broken one fails only at `docker run`, never at build.
      - name: assert the entrypoint runs
        run: docker run --rm mesopic-engine:ci version

  docs:
    name: docs site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # The build is the test: a page in `NAV` with no markdown behind it, a link that
      # goes nowhere, or a `var(--token)` `hud.css` does not define all fail here.
      - run: uv run pytest tools/docs/tests -q
      - run: uv run python -m tools.docs.build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: site/
          retention-days: 7

  deploy-docs:
    name: docs site (publish to Pages)
    needs: docs
    runs-on: ubuntu-latest
    # Inert until the repository is public, and deliberately so. GitHub Pages on a
    # private repository needs a paid plan, exactly like branch protection and
    # Environments — the two things this org already does without. Rather than placehold
    # the publish step, it ships switched off and starts working by itself at P5.6, the
    # same pattern `release.yml` uses for `attest-build-provenance`. Confirm it on the
    # first push after going public rather than assuming.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false
    permissions:
      pages: write
      id-token: write
    # `deploy-pages` requires this environment. It is safe to name here while the repo is
    # private only because the job cannot run: Environments are themselves a paid feature,
    # and going public restores both at once.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m tools.docs.build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
