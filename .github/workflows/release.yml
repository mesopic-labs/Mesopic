# Releases are cut from tags by CI, never from a maintainer's laptop (implements P5.1).
#
# A tag on main produces: a multi-arch engine image on GHCR, an SBOM, a Sigstore
# signature, and build provenance. Everything a downstream user needs to verify that the
# image they pulled is the code in this repository.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: build, sign, and publish the engine image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # OIDC — for keyless signing. No long-lived registry key exists.
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # GHCR namespaces must be lowercase. `github.repository_owner` preserves the
      # account's casing, and metadata-action lowercases for us but the signing, SBOM,
      # and attestation steps below use the name directly — so resolve it once, here.
      - id: img
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/muster-engine" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `is_default_branch` is false on a tag push, so it would never have applied
            # `latest` — and the README tells people to pull `:latest`. Apply it on any
            # release tag that is not a pre-release (no hyphen: v1.2.0 yes, v1.2.0-rc1 no).
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/engine.Dockerfile
          # The N100 baseline is amd64; arm64 covers the Pi-class and Apple-silicon crowd.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: sign the image (keyless, via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: muster-engine-sbom.spdx.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
