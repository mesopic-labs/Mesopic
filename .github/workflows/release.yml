# Releases are cut from tags by CI, never from a maintainer's laptop (implements P5.1).
#
# A tag on main produces: a multi-arch engine image on GHCR, an SBOM, a Sigstore
# signature, and build provenance. Everything a downstream user needs to verify that the
# image they pulled is the code in this repository.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: build, sign, and publish the engine image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # OIDC — for keyless signing. No long-lived registry key exists.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR namespaces must be lowercase. `github.repository_owner` preserves the
      # account's casing, and metadata-action lowercases for us but the signing, SBOM,
      # and attestation steps below use the name directly — so resolve it once, here.
      - id: img
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/mesopic-engine" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `is_default_branch` is false on a tag push, so it would never have applied
            # `latest` — and the README tells people to pull `:latest`. Apply it on any
            # release tag that is not a pre-release (no hyphen: v1.2.0 yes, v1.2.0-rc1 no).
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/engine.Dockerfile
          # The N100 baseline is amd64; arm64 covers the Pi-class and Apple-silicon crowd.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign the image (keyless, via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: mesopic-engine-sbom.spdx.json

      # The image already carries SLSA provenance and an SBOM in the registry: the build
      # step above passes `--attest type=provenance,mode=max --attest type=sbom`. This
      # step persists a second copy to GitHub's own attestation store, which is not
      # available on a user-owned private repository — it fails the whole release rather
      # than degrading (measured on v0.1.0-rc1). Gating on visibility rather than
      # deleting it means it starts working by itself the day the repo goes public,
      # instead of becoming a checklist item nobody remembers.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
