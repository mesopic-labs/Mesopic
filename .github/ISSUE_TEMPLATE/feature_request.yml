name: Feature request
description: Propose something Mesopic should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **v1 scope is deliberately locked** to the core six metrics plus zone heatmaps and
        staff-vs-customer. Loss prevention, face recognition, pose estimation, and ANPR are
        explicitly out — not forgotten. Anything that stores pixels, sends video off-box,
        or adds biometric identity needs an ADR before code, and will likely be declined.

  - type: textarea
    id: problem
    attributes:
      label: The problem you are actually trying to solve
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like Mesopic to do
    validations:
      required: true

  - type: checkboxes
    id: invariants
    attributes:
      label: Compatibility with the privacy invariants
      options:
        - label: This does not require storing frames, sending video off-box, or identifying people.
          required: true
