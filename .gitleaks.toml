# gitleaks config for Muster.
# Runs in pre-commit (staged changes) and in CI (full history on PRs).
# Extends the upstream default ruleset rather than replacing it.

title = "Muster gitleaks config"

[extend]
useDefault = true

# --- Project-specific rules -------------------------------------------------
# RTSP URLs embed camera credentials. They must never appear in the repo, not
# even in a test fixture: use rtsp://user:pass@... only, or a mediamtx URL.
# gitleaks uses Go's RE2, which has no lookahead — the documented `user:pass@`
# placeholder is exempted in the allowlist below rather than in this pattern.
[[rules]]
id = "muster-rtsp-credentials"
description = "RTSP URL with embedded credentials"
regex = '''rtsp://[A-Za-z0-9._%-]+:[^@\s/'"]+@'''
tags = ["muster", "camera", "credentials"]

# Per-site cloud sync tokens (see cloud-architecture §5.1).
[[rules]]
id = "muster-site-token"
description = "Muster per-site API key"
regex = '''\bsk_site_[A-Za-z0-9]{16,}\b'''
tags = ["muster", "api-key"]

# --- Allowlist --------------------------------------------------------------
[allowlist]
description = "Documented placeholders and fixtures"
paths = [
  '''\.gitleaks\.toml$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)uv\.lock$''',
]
regexes = [
  # The documented placeholder form used throughout the docs and examples.
  '''rtsp://user:pass@''',
  '''sk_site_\.\.\.''',
  '''(?i)(changeme|replace-me|your-.*-here|xxx+)''',
]
