# Workspace root. Deliberately NOT a package — it holds the uv workspace and the
# shared toolchain config; package metadata lives in mesopic-engine/pyproject.toml.
#
# This repository is the MIT engine, and only the MIT engine.

[tool.uv.workspace]
members = ["mesopic-engine"]
# The proprietary hosted layer lives in its own private repository. It is not a
# workspace member, not a dependency, and not present in this tree — see README.

[tool.uv.sources]
mesopic = { workspace = true }

[dependency-groups]
dev = [
  "mesopic",
  "ruff>=0.14.2",
  "mypy>=1.18",
  "import-linter>=2.3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "pre-commit>=4.0",
  "types-PyYAML>=6.0",
]

# ---------------------------------------------------------------------------
# ruff — lint + format, one tool, one config (tech-stack.md §6)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["mesopic-engine/src"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
  "F",     # pyflakes
  "E", "W",# pycodestyle
  "I",     # isort — imports at the top, ordered
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "ANN",   # missing annotations (public API is typed — tech-stack.md §6)
  "ASYNC", # async correctness
  "S",     # bandit — the security ruleset
  "BLE",   # no bare except
  "B",     # bugbear
  "A",     # builtin shadowing
  "C4",    # comprehensions
  "DTZ",   # naive datetimes — "UTC everywhere" made mechanical
  "T20",   # no print() outside the CLI
  "EM",    # exception messages not inlined
  "PIE", "PT", "RET", "SIM", "TID", "ARG",
  "PTH",   # pathlib over os.path
  "ERA",   # no commented-out code
  "PL",    # pylint subset
  "TRY",   # exception antipatterns
  "PERF",
  "RUF",
]
ignore = [
  "ANN401",  # typing.Any is sometimes the honest annotation at a boundary
  "TRY003",  # long messages inline are fine for our error types
  "PLR0913", # argument count is reviewed, not linted
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ANN201", "ARG001"]   # asserts and magic numbers are the point
"**/cli.py" = ["T20"]                                      # the CLI is allowed to print
"**/tests/association/test_sweep.py" = ["T20"]              # the sweep's table IS its output
"**/conftest.py" = ["ANN201"]
# `mesopic.types` is named by the architecture docs.
# Shadowing the stdlib `types` module is harmless under absolute imports.
"**/types.py" = ["A005"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["mesopic"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy — strict, and it means it. No blanket ignores: narrow the rule and say why.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
mypy_path = ["mesopic-engine/src"]
explicit_package_bases = true
exclude = ["build/", "dist/"]

# Third-party packages without stubs. Add here with a reason, never inline.
# `openvino` is additionally an opt-in extra (ADR-0012): it is absent from the default
# dev environment by design, so mypy has no implementation to resolve either.
[[tool.mypy.overrides]]
module = ["av.*", "cv2.*", "onnxruntime.*", "openvino.*", "paho.*"]
ignore_missing_imports = true

# scipy.optimize.linear_sum_assignment is the tracker's Hungarian solver (ADR-0014).
# scipy.stats.ttest_rel is the ADR-0014 association benchmark's significance test
# (tests/association/test_sweep.py). scipy (1.18.0, this workspace) ships no py.typed
# marker, so mypy has no inline types to fall back on and wants the separate
# scipy-stubs package.
[[tool.mypy.overrides]]
module = ["scipy.optimize", "scipy.stats"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["mesopic-engine/tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
  "slow: heavier tests (golden clips, soaks) — excluded from the fast commit loop",
  "integration: needs an external service (mediamtx, mqtt)",
  "privacy: asserts a privacy invariant (no frame bytes, no cross-tenant read)",
]

[tool.coverage.run]
branch = true
source = ["mesopic-engine/src"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "class .*\\(Protocol\\):",
  "@overload",
]

# ---------------------------------------------------------------------------
# import-linter — the licence and layering boundaries, enforced structurally
# (implementation-plan.md P0.4). These are architecture, not style.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["mesopic"]
# Some boundaries are drawn against third-party packages: `domain/` must not reach for
# FastAPI, and the sync client must not reach for a video codec.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The MIT engine never imports the proprietary cloud (ADR-0001, ADR-0008)"
type = "forbidden"
source_modules = ["mesopic"]
# The hosted layer is a separate private repository, so this is belt-and-braces: it
# catches the day someone vendors it back in for convenience.
forbidden_modules = ["mesopic_cloud"]

[[tool.importlinter.contracts]]
name = "Analytics computes, it does not persist or serve (engine-architecture §2)"
type = "forbidden"
source_modules = ["mesopic.analytics"]
forbidden_modules = ["mesopic.store", "mesopic.api", "mesopic.sync", "mesopic.exporters"]

[[tool.importlinter.contracts]]
name = "Detector and tracker know nothing of geometry or storage (engine-architecture §2)"
type = "forbidden"
source_modules = ["mesopic.detector", "mesopic.tracker"]
forbidden_modules = ["mesopic.analytics", "mesopic.store", "mesopic.aggregator", "mesopic.api"]

[[tool.importlinter.contracts]]
name = "Ingest hands over frames and nothing else (engine-architecture §4)"
type = "forbidden"
source_modules = ["mesopic.ingest"]
forbidden_modules = ["mesopic.detector", "mesopic.tracker", "mesopic.analytics", "mesopic.store"]

[[tool.importlinter.contracts]]
name = "The sync client reads metrics, never frames (ADR-0005)"
type = "forbidden"
source_modules = ["mesopic.sync"]
forbidden_modules = ["mesopic.ingest", "mesopic.detector", "av", "cv2"]

[[tool.importlinter.contracts]]
name = "The dashboard serves numbers, never frames (engine-architecture §13)"
source_modules = ["mesopic.api"]
type = "forbidden"
# The web layer is the one part of the engine reachable from a browser, so the "frames
# never leave the box" guarantee is worth having as a property of the import graph rather
# than of everyone's care. It also keeps the handlers thin by construction: with no
# decoder and no detector in reach, the only thing an endpoint can do is read the store.
#
# P3.3's calibration snapshot is the single exception in §13, and it is NOT an exception
# to this contract: the snapshot is grabbed by the worker that already owns the stream and
# handed over as bytes, so the browser gets a frame without this package ever importing a
# codec. If that turns out to need `mesopic.ingest` here, the answer is a new seam, not a
# wider contract.
forbidden_modules = ["mesopic.ingest", "mesopic.detector", "mesopic.tracker", "av", "cv2"]

[[tool.importlinter.contracts]]
name = "Ground truth handles labels, never pixels (ADR-0015)"
type = "forbidden"
source_modules = ["mesopic.truth"]
# The truth set is crossing timestamps and directions — numbers a human wrote down. A
# decoder reachable from here is how "we label footage" quietly becomes "we process
# footage", and how this suite would stop being runnable in CI with no clips on disk.
forbidden_modules = ["mesopic.ingest", "mesopic.detector", "av", "cv2"]
